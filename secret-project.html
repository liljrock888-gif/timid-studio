<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Project | Timid Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #030712;
      color: white;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(100%, 620px);
      padding: 36px;
      border: 2px solid #168cff;
      border-radius: 18px;
      background: linear-gradient(145deg, #071426, #0b1020);
      box-shadow: 0 0 18px rgba(0, 132, 255, .35), 0 0 28px rgba(255, 36, 56, .18);
    }

    .status {
      display: inline-block;
      margin-bottom: 18px;
      padding: 6px 12px;
      border-radius: 30px;
      background: linear-gradient(135deg, #087cff, #d9142f);
      font-size: 13px;
    }

    h1 {
      margin-bottom: 14px;
      font-size: 38px;
    }

    p {
      color: #c4cbd5;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 18px;
      border-radius: 10px;
      background: linear-gradient(135deg, #087cff, #d9142f);
      color: white;
      font-weight: bold;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 3px solid #55b7ff;
      outline-offset: 4px;
    }

    @media (max-width: 480px) {
      main {
        padding: 26px;
      }

      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="status">COMING SOON</div>
    <h1>Secret Project</h1>
    <p>Something new is being built behind the scenes. More information coming soon.</p>
    <a href="index.html#projects">Back to projects</a>
  </main>
</body>
</html>
