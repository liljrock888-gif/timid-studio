<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Purchase Successful | Timid Studio</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, #351466, transparent 35%),
        radial-gradient(circle at 80% 70%, #102b55, transparent 35%),
        #070812;
      color: white;

      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      padding: 25px;
    }

    .success-card {
      width: 100%;
      max-width: 600px;

      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 25px;

      padding: 45px;
      text-align: center;

      box-shadow: 0 0 60px rgba(139,92,246,.15);
    }

    .check {
      font-size: 60px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 15px;

      background: linear-gradient(
        90deg,
        #a970ff,
        #48c6ff,
        #ff72d2
      );

      -webkit-background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: #aaa;
      line-height: 1.7;
      margin-bottom: 35px;
    }

    .steps {
      text-align: left;
      background: rgba(255,255,255,.04);
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 30px;
    }

    .steps p {
      margin: 15px 0;
      color: #ddd;
    }

    .button {
      display: inline-block;
      padding: 15px 28px;

      background: linear-gradient(
        90deg,
        #7847ff,
        #a970ff
      );

      color: white;
      text-decoration: none;
      font-weight: bold;

      border-radius: 10px;
      box-shadow: 0 0 25px #8c52ff55;
    }

    .logo {
      margin-top: 35px;
      color: #777;
      letter-spacing: 3px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="success-card">

    <div class="check">✓</div>

    <h1>Purchase Successful!</h1>

    <p class="subtitle">
      Thank you for purchasing a Discord Activity Bot
      from Timid Studio.
    </p>

    <div class="steps">

      <p>
        <strong>1.</strong>
        Join the Timid Studio Discord.
      </p>

      <p>
        <strong>2.</strong>
        Open a purchase/setup ticket.
      </p>

      <p>
        <strong>3.</strong>
        Tell us which Activity Bot you purchased.
      </p>

      <p>
        <strong>4.</strong>
        We'll help you get your bot set up.
      </p>

    </div>

    <a
      class="button"
      href="https://discord.gg/S8bdA6CJUC"
      target="_blank"
    >
      Join Discord & Get My Bot
    </a>

    <div class="logo">
      TIMID STUDIO
    </div>

  </div>

</body>
</html>
